name: Seal Secrets

# ==============================================
# Hybrid secrets pipeline:
#   GitHub Secret → kubeseal → git → ArgoCD → SealedSecrets → K8s Secret
#
# 1. Token lives in GitHub Secrets (source of truth)
# 2. This workflow seals it with the cluster's public cert
# 3. Encrypted SealedSecret is committed to the repo
# 4. ArgoCD deploys it, SealedSecrets controller decrypts it
# ==============================================

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Secret to seal (cloudflared tunnel token and/or harness secrets)'
        required: false
        type: string
  push:
    branches: [master]
    paths:
      - '.github/sealed-secrets-cert.pem'
      - '.github/workflows/seal-secrets.yml'

permissions:
  contents: write  # needed to push the sealed secret back

# Reseal 2026-08-31: Home Assistant token and Google Calendar credentials,
# re-run after adding GOOGLE_AI_API_KEY, so the assistant has a model it can
# actually reach while the Anthropic balance is empty. Pushed, not
# dispatched, so cloudflared is left alone.

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeseal
        run: |
          KUBESEAL_VERSION="0.28.0"
          curl -sLo kubeseal.tar.gz \
            "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz"
          tar -xzf kubeseal.tar.gz kubeseal
          sudo install -m 755 kubeseal /usr/local/bin/kubeseal
          kubeseal --version

      - name: Seal Cloudflare Tunnel Token
        # Manual only. The tunnel is external access and its token changes
        # almost never, so resealing it on every workflow edit risks trading
        # a SealedSecret that demonstrably works for whatever happens to be
        # in GitHub. Run the workflow by hand after rotating the token.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_TUNNEL_TOKEN GitHub secret is not set. Skipping."
            exit 0
          fi

          echo "==> Creating SealedSecret from GitHub secret..."
          kubectl create secret generic cloudflared-tunnel-token \
            --namespace=media \
            --from-literal=token="$CLOUDFLARE_TUNNEL_TOKEN" \
            --dry-run=client -o yaml | \
          kubeseal \
            --cert .github/sealed-secrets-cert.pem \
            --format yaml \
            -w apps/cloudflared/sealed-secret.yaml

          echo "==> SealedSecret created."

      - name: Seal the Cloudflare DNS token for cert-manager
        # A ClusterIssuer reads its credentials from cert-manager's namespace,
        # so this is a separate Secret from the assistant's -- not another key
        # inside harness-secrets.
        if: ${{ !cancelled() }}
        env:
          CF_DNS_TOKEN: ${{ secrets.CF_DNS_TOKEN }}
        run: |
          if [ -z "$CF_DNS_TOKEN" ]; then
            echo "::warning::CF_DNS_TOKEN is not set. Skipping."
            exit 0
          fi

          kubectl create secret generic cloudflare-dns-token \
            --namespace=cert-manager \
            --from-literal=token="$CF_DNS_TOKEN" \
            --dry-run=client -o yaml | \
          kubeseal \
            --cert .github/sealed-secrets-cert.pem \
            --format yaml \
            -w apps/cert-manager/sealed-secret.yaml

          echo "==> cert-manager SealedSecret written."

      - name: Seal harness secrets
        # Independent of the step above: a cloudflared failure must not
        # silently skip the credentials the assistant actually needs.
        if: ${{ !cancelled() }}
        env:
          CF_ACCOUNT_ID:        ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_GATEWAY:        ${{ vars.CF_AI_GATEWAY || 'home-harness' }}
          CF_AI_GATEWAY_TOKEN:  ${{ secrets.CF_AI_GATEWAY_TOKEN }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_AI_API_KEY:    ${{ secrets.GOOGLE_AI_API_KEY }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          CF_WORKERS_AI_TOKEN:  ${{ secrets.CF_WORKERS_AI_TOKEN }}
          ELEVENLABS_API_KEY:   ${{ secrets.ELEVENLABS_API_KEY }}
          DEEPGRAM_API_KEY:     ${{ secrets.DEEPGRAM_API_KEY }}
          # Defaulted, not required: these two are configuration, not secrets,
          # and an unset GitHub Variable would otherwise seal as an empty
          # string and wipe a working value out of the cluster.
          HA_URL:               ${{ vars.HA_URL || 'http://192.168.1.117:8123' }}
          HA_TOKEN:             ${{ secrets.HA_TOKEN }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID:   ${{ vars.GOOGLE_CALENDAR_ID || 'primary' }}
          TOOLS_API_KEY:      ${{ secrets.TOOLS_API_KEY }}
          WEBUI_SECRET_KEY:      ${{ secrets.WEBUI_SECRET_KEY }}
        run: |
          # Never seal a set of empty values -- ArgoCD would apply the result
          # and wipe working credentials. TOOLS_API_KEY is the sentinel:
          # nothing works without it, so if it is unset the repository secrets
          # have not been configured yet.
          if [ -z "$TOOLS_API_KEY" ]; then
            echo "::warning::TOOLS_API_KEY is not set. Skipping the harness secret."
            exit 0
          fi

          echo "==> Creating SealedSecret for the harness..."
          args=()
          for k in CF_ACCOUNT_ID CF_AI_GATEWAY CF_AI_GATEWAY_TOKEN \
                   ANTHROPIC_API_KEY OPENAI_API_KEY GOOGLE_AI_API_KEY \
                   OPENROUTER_API_KEY GROQ_API_KEY CF_WORKERS_AI_TOKEN \
                   ELEVENLABS_API_KEY DEEPGRAM_API_KEY \
                   HA_URL HA_TOKEN \
                   GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN \
                   GOOGLE_CALENDAR_ID TOOLS_API_KEY WEBUI_SECRET_KEY; do
            args+=(--from-literal="$k=${!k}")
          done

          # The gateway is authenticated, so Open WebUI must send
          # cf-aig-authorization. It has no env var for a single header -- it
          # takes a JSON map of per-connection headers, composed here so the
          # token stays a plain GitHub Secret. Empty token => empty JSON,
          # which Open WebUI ignores rather than sending a broken header.
          if [ -n "$CF_AI_GATEWAY_TOKEN" ]; then
            OPENAI_API_CONFIGS='{"0":{"headers":{"cf-aig-authorization":"Bearer '"$CF_AI_GATEWAY_TOKEN"'"}}}'
          else
            OPENAI_API_CONFIGS=''
            echo "::warning::CF_AI_GATEWAY_TOKEN unset; Open WebUI will get the gateway's 401."
          fi
          args+=(--from-literal="OPENAI_API_CONFIGS=$OPENAI_API_CONFIGS")

          # The tool server registration. Composed here rather than typed
          # into the admin UI, because ENABLE_PERSISTENT_CONFIG=false makes
          # the app read this from the environment and ignore the database.
          # A heredoc cannot be used here: its body has to start at column 0,
          # which escapes this block scalar and makes the workflow unparseable.
          TOOL_SERVER_CONNECTIONS='[{"url":"http://harness.assistant.svc.cluster.local",'
          TOOL_SERVER_CONNECTIONS+='"path":"openapi.json","type":"openapi","auth_type":"bearer",'
          TOOL_SERVER_CONNECTIONS+='"headers":null,"key":"'"$TOOLS_API_KEY"'",'
          TOOL_SERVER_CONNECTIONS+='"config":{"enable":true,"function_name_filter_list":"","access_grants":[]},'
          TOOL_SERVER_CONNECTIONS+='"info":{"id":"","name":"Casa","description":"Home Assistant and Google Calendar"},'
          TOOL_SERVER_CONNECTIONS+='"spec_type":"url","spec":""}]'
          args+=(--from-literal="TOOL_SERVER_CONNECTIONS=$TOOL_SERVER_CONNECTIONS")

          kubectl create secret generic harness-secrets \
            --namespace=assistant \
            "${args[@]}" \
            --dry-run=client -o yaml | \
          kubeseal \
            --cert .github/sealed-secrets-cert.pem \
            --format yaml \
            -w apps/assistant/sealed-secret.yaml

          # First seal only: register the file so kustomize picks it up.
          # Referencing it before it exists would break every ArgoCD sync.
          if ! grep -q 'sealed-secret.yaml' apps/assistant/kustomization.yaml; then
            sed -i 's|^  - network-policy.yaml$|  - network-policy.yaml\n  - sealed-secret.yaml|' \
              apps/assistant/kustomization.yaml
            echo "::notice::Added sealed-secret.yaml to apps/assistant/kustomization.yaml."
          fi

          echo "==> SealedSecret created."

      - name: Commit sealed secrets
        run: |
          # A seal step may legitimately have skipped, so only stage files
          # that actually exist. Staging before comparing matters: git diff
          # reports no change for an untracked file, which would silently
          # drop the very first seal.
          staged=0
          for f in apps/cloudflared/sealed-secret.yaml \
                   apps/assistant/sealed-secret.yaml \
                   apps/assistant/kustomization.yaml \
                   apps/cert-manager/sealed-secret.yaml; do
            if [ -f "$f" ]; then
              git add "$f"
              staged=1
            fi
          done

          if [ "$staged" = "0" ] || git diff --cached --quiet; then
            echo "::notice::Sealed secrets unchanged. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(secrets): update sealed secrets"
          git push
          echo "::notice::Sealed secrets committed and pushed."
