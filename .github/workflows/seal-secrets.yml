name: Seal Secrets

# ==============================================
# Hybrid secrets pipeline:
#   GitHub Secret → kubeseal → git → ArgoCD → SealedSecrets → K8s Secret
#
# 1. Token lives in GitHub Secrets (source of truth)
# 2. This workflow seals it with the cluster's public cert
# 3. Encrypted SealedSecret is committed to the repo
# 4. ArgoCD deploys it, SealedSecrets controller decrypts it
# ==============================================

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Secret to seal (cloudflared tunnel token and/or harness secrets)'
        required: false
        type: string
  push:
    branches: [master]
    paths:
      - '.github/sealed-secrets-cert.pem'
      - '.github/workflows/seal-secrets.yml'

permissions:
  contents: write  # needed to push the sealed secret back

# Reseal 2026-08-31 (later): Google refresh token reissued with the
# auth/tasks scope added, so the assistant can read the to-do list.
# Pushed, not dispatched, so cloudflared is left alone.

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeseal
        run: |
          KUBESEAL_VERSION="0.28.0"
          curl -sLo kubeseal.tar.gz \
            "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz"
          tar -xzf kubeseal.tar.gz kubeseal
          sudo install -m 755 kubeseal /usr/local/bin/kubeseal
          kubeseal --version

      - name: Seal Cloudflare Tunnel Token
        # Manual only. The tunnel is external access and its token changes
        # almost never, so resealing it on every workflow edit risks trading
        # a SealedSecret that demonstrably works for whatever happens to be
        # in GitHub. Run the workflow by hand after rotating the token.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_TUNNEL_TOKEN GitHub secret is not set. Skipping."
            exit 0
          fi

          echo "==> Creating SealedSecret from GitHub secret..."
          kubectl create secret generic cloudflared-tunnel-token \
            --namespace=media \
            --from-literal=token="$CLOUDFLARE_TUNNEL_TOKEN" \
            --dry-run=client -o yaml | \
          kubeseal \
            --cert .github/sealed-secrets-cert.pem \
            --format yaml \
            -w apps/cloudflared/sealed-secret.yaml

          echo "==> SealedSecret created."

      - name: Seal the Cloudflare DNS token for cert-manager
        # A ClusterIssuer reads its credentials from cert-manager's namespace,
        # so this is a separate Secret from the assistant's -- not another key
        # inside harness-secrets.
        if: ${{ !cancelled() }}
        env:
          CF_DNS_TOKEN: ${{ secrets.CF_DNS_TOKEN }}
        run: |
          if [ -z "$CF_DNS_TOKEN" ]; then
            echo "::warning::CF_DNS_TOKEN is not set. Skipping."
            exit 0
          fi

          kubectl create secret generic cloudflare-dns-token \
            --namespace=cert-manager \
            --from-literal=token="$CF_DNS_TOKEN" \
            --dry-run=client -o yaml | \
          kubeseal \
            --cert .github/sealed-secrets-cert.pem \
            --format yaml \
            -w apps/cert-manager/sealed-secret.yaml

          echo "==> cert-manager SealedSecret written."

      - name: Seal health secrets
        # InfluxDB and Grafana live in their own namespace, so this is a
        # separate Secret rather than more keys in harness-secrets.
        if: ${{ !cancelled() }}
        env:
          INFLUXDB_ADMIN_PASSWORD: ${{ secrets.INFLUXDB_ADMIN_PASSWORD }}
          INFLUXDB_ADMIN_TOKEN:    ${{ secrets.INFLUXDB_ADMIN_TOKEN }}
          GRAFANA_ADMIN_PASSWORD:  ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          # INFLUXDB_ADMIN_TOKEN is the sentinel: Home Assistant and Grafana
          # both authenticate with it, so nothing works without it. Sealing a
          # set of empty values would wipe working credentials.
          if [ -z "$INFLUXDB_ADMIN_TOKEN" ]; then
            echo "::warning::INFLUXDB_ADMIN_TOKEN is not set. Skipping the health secret."
            exit 0
          fi

          kubectl create secret generic health-secrets \
            --namespace=health \
            --from-literal=INFLUXDB_ADMIN_PASSWORD="$INFLUXDB_ADMIN_PASSWORD" \
            --from-literal=INFLUXDB_ADMIN_TOKEN="$INFLUXDB_ADMIN_TOKEN" \
            --from-literal=GRAFANA_ADMIN_PASSWORD="$GRAFANA_ADMIN_PASSWORD" \
            --dry-run=client -o yaml | \
          kubeseal \
            --cert .github/sealed-secrets-cert.pem \
            --format yaml \
            -w apps/health/sealed-secret.yaml

          echo "==> health SealedSecret written."

      - name: Seal harness secrets
        # Independent of the step above: a cloudflared failure must not
        # silently skip the credentials the assistant actually needs.
        if: ${{ !cancelled() }}
        env:
          CF_ACCOUNT_ID:        ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_GATEWAY:        ${{ vars.CF_AI_GATEWAY || 'home-harness' }}
          CF_AI_GATEWAY_TOKEN:  ${{ secrets.CF_AI_GATEWAY_TOKEN }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_AI_API_KEY:    ${{ secrets.GOOGLE_AI_API_KEY }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          CF_WORKERS_AI_TOKEN:  ${{ secrets.CF_WORKERS_AI_TOKEN }}
          ELEVENLABS_API_KEY:   ${{ secrets.ELEVENLABS_API_KEY }}
          DEEPGRAM_API_KEY:     ${{ secrets.DEEPGRAM_API_KEY }}
          # Defaulted, not required: these two are configuration, not secrets,
          # and an unset GitHub Variable would otherwise seal as an empty
          # string and wipe a working value out of the cluster.
          HA_URL:               ${{ vars.HA_URL || 'http://192.168.1.117:8123' }}
          HA_TOKEN:             ${{ secrets.HA_TOKEN }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID:   ${{ vars.GOOGLE_CALENDAR_ID || 'primary' }}
          # Read-only use in the assistant namespace: the tool server queries
          # the health bucket. Same value as the health namespace Secret.
          INFLUXDB_ADMIN_TOKEN: ${{ secrets.INFLUXDB_ADMIN_TOKEN }}
          TOOLS_API_KEY:      ${{ secrets.TOOLS_API_KEY }}
          WEBUI_SECRET_KEY:      ${{ secrets.WEBUI_SECRET_KEY }}
        run: |
          # Never seal a set of empty values -- ArgoCD would apply the result
          # and wipe working credentials. TOOLS_API_KEY is the sentinel:
          # nothing works without it, so if it is unset the repository secrets
          # have not been configured yet.
          if [ -z "$TOOLS_API_KEY" ]; then
            echo "::warning::TOOLS_API_KEY is not set. Skipping the harness secret."
            exit 0
          fi

          echo "==> Creating SealedSecret for the harness..."
          args=()
          suspicious=()
          for k in CF_ACCOUNT_ID CF_AI_GATEWAY CF_AI_GATEWAY_TOKEN \
                   ANTHROPIC_API_KEY OPENAI_API_KEY GOOGLE_AI_API_KEY \
                   OPENROUTER_API_KEY GROQ_API_KEY CF_WORKERS_AI_TOKEN \
                   ELEVENLABS_API_KEY DEEPGRAM_API_KEY \
                   HA_URL HA_TOKEN \
                   GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN \
                   GOOGLE_CALENDAR_ID TOOLS_API_KEY WEBUI_SECRET_KEY \
                   INFLUXDB_ADMIN_TOKEN; do
            v="${!k}"
            args+=(--from-literal="$k=$v")

            # `gh secret set --body -` writes the literal string "-": --body
            # takes a string, and stdin is read only when --body is OMITTED.
            # All 12 secrets once became one character each, sealed cleanly,
            # and applied to the cluster looking perfectly healthy -- key
            # present, non-empty, right shape. Only the length gave it away.
            # Verify by LENGTH, not presence.
            #
            # An empty value is legitimate (an unconfigured optional vendor),
            # so only non-empty-but-implausibly-short is an error. The shortest
            # real value here is GOOGLE_CALENDAR_ID="primary", at 7.
            if [ -n "$v" ] && [ ${#v} -lt 4 ]; then
              suspicious+=("$k (${#v} chars)")
            fi
          done

          if [ ${#suspicious[@]} -gt 0 ]; then
            echo "::error::Implausibly short secret values. Refusing to seal:"
            printf '::error::  %s\n' "${suspicious[@]}"
            echo "::error::Re-set them in GitHub Secrets. If sync-github-secrets.sh was used, check for 'gh secret set --body -' -- omit --body to read stdin."
            exit 1
          fi

          # Two connections, and both halves have to line up by INDEX:
          # OPENAI_API_BASE_URLS (ConfigMap) is ';'-separated, OPENAI_API_KEYS
          # is ';'-separated in the same order, and OPENAI_API_CONFIGS is keyed
          # "0" and "1" to match. Get the order wrong and Open WebUI sends
          # Google's key to OpenRouter.
          #
          #   0  google-ai-studio  -- Gemini, the default
          #   1  compat            -- OpenRouter, multi-provider
          #
          # The keys are composed here rather than as two Deployment env vars
          # because Kubernetes cannot join two Secret keys into one value.
          OPENAI_API_KEYS="${GOOGLE_AI_API_KEY};${OPENROUTER_API_KEY}"
          args+=(--from-literal="OPENAI_API_KEYS=$OPENAI_API_KEYS")

          # The gateway is authenticated, so Open WebUI must send
          # cf-aig-authorization on BOTH connections. It has no env var for a
          # single header -- it takes a JSON map of per-connection headers,
          # composed here so the token stays a plain GitHub Secret. Empty
          # token => empty JSON, which Open WebUI ignores rather than sending
          # a broken header.
          #
          # model_ids whitelists connection 1: the compat endpoint advertises
          # ~2600 models across every vendor, and without this they all land
          # in the model picker.
          if [ -n "$CF_AI_GATEWAY_TOKEN" ]; then
            AIG='{"cf-aig-authorization":"Bearer '"$CF_AI_GATEWAY_TOKEN"'"}'
            OPENAI_API_CONFIGS='{"0":{"headers":'"$AIG"'},'
            OPENAI_API_CONFIGS+='"1":{"headers":'"$AIG"',"model_ids":['
            OPENAI_API_CONFIGS+='"openrouter/deepseek/deepseek-v4-flash",'
            OPENAI_API_CONFIGS+='"openrouter/z-ai/glm-5.2:free",'
            OPENAI_API_CONFIGS+='"openrouter/minimax/minimax-m3:free"]}}'
          else
            OPENAI_API_CONFIGS=''
            echo "::warning::CF_AI_GATEWAY_TOKEN unset; Open WebUI will get the gateway's 401."
          fi
          args+=(--from-literal="OPENAI_API_CONFIGS=$OPENAI_API_CONFIGS")

          # The tool server registration. Composed here rather than typed
          # into the admin UI, because ENABLE_PERSISTENT_CONFIG=false makes
          # the app read this from the environment and ignore the database.
          # A heredoc cannot be used here: its body has to start at column 0,
          # which escapes this block scalar and makes the workflow unparseable.
          TOOL_SERVER_CONNECTIONS='[{"url":"http://harness.assistant.svc.cluster.local",'
          TOOL_SERVER_CONNECTIONS+='"path":"openapi.json","type":"openapi","auth_type":"bearer",'
          TOOL_SERVER_CONNECTIONS+='"headers":null,"key":"'"$TOOLS_API_KEY"'",'
          TOOL_SERVER_CONNECTIONS+='"config":{"enable":true,"function_name_filter_list":"","access_grants":[]},'
          TOOL_SERVER_CONNECTIONS+='"info":{"id":"","name":"Casa","description":"Home Assistant and Google Calendar"},'
          TOOL_SERVER_CONNECTIONS+='"spec_type":"url","spec":""}]'
          args+=(--from-literal="TOOL_SERVER_CONNECTIONS=$TOOL_SERVER_CONNECTIONS")

          kubectl create secret generic harness-secrets \
            --namespace=assistant \
            "${args[@]}" \
            --dry-run=client -o yaml | \
          kubeseal \
            --cert .github/sealed-secrets-cert.pem \
            --format yaml \
            -w apps/assistant/sealed-secret.yaml

          # First seal only: register the file so kustomize picks it up.
          # Referencing it before it exists would break every ArgoCD sync.
          if ! grep -q 'sealed-secret.yaml' apps/assistant/kustomization.yaml; then
            sed -i 's|^  - network-policy.yaml$|  - network-policy.yaml\n  - sealed-secret.yaml|' \
              apps/assistant/kustomization.yaml
            echo "::notice::Added sealed-secret.yaml to apps/assistant/kustomization.yaml."
          fi

          echo "==> SealedSecret created."

      - name: Commit sealed secrets
        run: |
          # Discover the seal targets rather than listing them. A hardcoded
          # list silently drops a newly added target -- the seal step writes
          # the file in the runner, nothing stages it, the file is lost when
          # the runner goes away, and the run still reports success.
          mapfile -t files < <(find apps -type f -name 'sealed-secret.yaml' | sort)

          # The assistant kustomization is regenerated alongside its secret.
          if [ -f apps/assistant/kustomization.yaml ]; then
            files+=(apps/assistant/kustomization.yaml)
          fi

          if [ ${#files[@]} -eq 0 ]; then
            echo "::notice::No sealed secrets on disk. Nothing to commit."
            exit 0
          fi

          echo "Staging:"
          printf '  %s\n' "${files[@]}"

          # Staging before comparing matters: git diff reports no change for
          # an untracked file, which would silently drop the very first seal.
          git add -- "${files[@]}"

          if git diff --cached --quiet; then
            echo "::notice::Sealed secrets unchanged. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(secrets): update sealed secrets"
          git push
          echo "::notice::Sealed secrets committed and pushed."
