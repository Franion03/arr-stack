name: Seal Secrets

# ==============================================
# Hybrid secrets pipeline:
#   GitHub Secret → kubeseal → git → ArgoCD → SealedSecrets → K8s Secret
#
# 1. Token lives in GitHub Secrets (source of truth)
# 2. This workflow seals it with the cluster's public cert
# 3. Encrypted SealedSecret is committed to the repo
# 4. ArgoCD deploys it, SealedSecrets controller decrypts it
# ==============================================

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Secret to seal (cloudflared tunnel token and/or harness secrets)'
        required: false
        type: string
  push:
    branches: [master]
    paths:
      - '.github/sealed-secrets-cert.pem'
      - '.github/workflows/seal-secrets.yml'

permissions:
  contents: write  # needed to push the sealed secret back

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeseal
        run: |
          KUBESEAL_VERSION="0.28.0"
          curl -sLo kubeseal.tar.gz \
            "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz"
          tar -xzf kubeseal.tar.gz kubeseal
          sudo install -m 755 kubeseal /usr/local/bin/kubeseal
          kubeseal --version

      - name: Seal Cloudflare Tunnel Token
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_TUNNEL_TOKEN GitHub secret is not set. Skipping."
            exit 0
          fi

          echo "==> Creating SealedSecret from GitHub secret..."
          kubectl create secret generic cloudflared-tunnel-token \
            --namespace=media \
            --from-literal=token="$CLOUDFLARE_TUNNEL_TOKEN" \
            --dry-run=client -o yaml | \
          kubeseal \
            --cert .github/sealed-secrets-cert.pem \
            --format yaml \
            -o apps/cloudflared/sealed-secret.yaml

          echo "==> SealedSecret created."

      - name: Seal harness secrets
        env:
          CF_ACCOUNT_ID:        ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_GATEWAY:        ${{ vars.CF_AI_GATEWAY }}
          CF_AI_GATEWAY_TOKEN:  ${{ secrets.CF_AI_GATEWAY_TOKEN }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_AI_API_KEY:    ${{ secrets.GOOGLE_AI_API_KEY }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          CF_WORKERS_AI_TOKEN:  ${{ secrets.CF_WORKERS_AI_TOKEN }}
          ELEVENLABS_API_KEY:   ${{ secrets.ELEVENLABS_API_KEY }}
          DEEPGRAM_API_KEY:     ${{ secrets.DEEPGRAM_API_KEY }}
          HA_URL:               ${{ vars.HA_URL }}
          HA_TOKEN:             ${{ secrets.HA_TOKEN }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID:   ${{ vars.GOOGLE_CALENDAR_ID }}
          TOOLS_API_KEY:      ${{ secrets.TOOLS_API_KEY }}
          WEBUI_SECRET_KEY:      ${{ secrets.WEBUI_SECRET_KEY }}
        run: |
          # Never seal a set of empty values -- ArgoCD would apply the result
          # and wipe working credentials. TOOLS_API_KEY is the sentinel:
          # nothing works without it, so if it is unset the repository secrets
          # have not been configured yet.
          if [ -z "$TOOLS_API_KEY" ]; then
            echo "::warning::TOOLS_API_KEY is not set. Skipping the harness secret."
            exit 0
          fi

          echo "==> Creating SealedSecret for the harness..."
          args=()
          for k in CF_ACCOUNT_ID CF_AI_GATEWAY CF_AI_GATEWAY_TOKEN \
                   ANTHROPIC_API_KEY OPENAI_API_KEY GOOGLE_AI_API_KEY \
                   OPENROUTER_API_KEY GROQ_API_KEY CF_WORKERS_AI_TOKEN \
                   ELEVENLABS_API_KEY DEEPGRAM_API_KEY \
                   HA_URL HA_TOKEN \
                   GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN \
                   GOOGLE_CALENDAR_ID TOOLS_API_KEY WEBUI_SECRET_KEY; do
            args+=(--from-literal="$k=${!k}")
          done

          kubectl create secret generic harness-secrets \
            --namespace=assistant \
            "${args[@]}" \
            --dry-run=client -o yaml | \
          kubeseal \
            --cert .github/sealed-secrets-cert.pem \
            --format yaml \
            -o apps/harness/sealed-secret.yaml

          # First seal only: register the file so kustomize picks it up.
          # Referencing it before it exists would break every ArgoCD sync.
          if ! grep -q 'sealed-secret.yaml' apps/harness/kustomization.yaml; then
            sed -i 's|^  - ingress.yaml$|  - ingress.yaml\n  - sealed-secret.yaml|' \
              apps/harness/kustomization.yaml
            echo "::notice::Added sealed-secret.yaml to apps/harness/kustomization.yaml."
          fi

          echo "==> SealedSecret created."

      - name: Commit sealed secrets
        run: |
          # A seal step may legitimately have skipped, so only stage files
          # that actually exist. Staging before comparing matters: git diff
          # reports no change for an untracked file, which would silently
          # drop the very first seal.
          staged=0
          for f in apps/cloudflared/sealed-secret.yaml \
                   apps/harness/sealed-secret.yaml \
                   apps/harness/kustomization.yaml; do
            if [ -f "$f" ]; then
              git add "$f"
              staged=1
            fi
          done

          if [ "$staged" = "0" ] || git diff --cached --quiet; then
            echo "::notice::Sealed secrets unchanged. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(secrets): update sealed secrets"
          git push
          echo "::notice::Sealed secrets committed and pushed."
