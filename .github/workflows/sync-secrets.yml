name: Sync Secrets to Kubernetes

# ==============================================
# This workflow pulls secrets from GitHub
# (Settings → Secrets and variables → Actions)
# and creates/updates them as Kubernetes Secrets
# in the cluster.
#
# REQUIRES a self-hosted GitHub Actions runner
# installed on the server that runs the K3s cluster.
# See scripts/setup-github-runner.sh
# ==============================================

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sync-secrets.yml'
      - 'scripts/create-cloudflare-secret.sh'
      - 'apps/cloudflared/**'
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Specific secret to sync (leave empty for all)'
        required: false
        type: string

jobs:
  sync-secrets:
    # Uses a self-hosted runner on the K3s server
    # so it can reach the cluster directly
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Cloudflare Tunnel Token
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_TUNNEL_TOKEN is not set as a GitHub secret. Skipping."
            exit 0
          fi

          echo "==> Creating/updating Kubernetes secret: cloudflared-tunnel-token"
          kubectl create secret generic cloudflared-tunnel-token \
            --namespace=media \
            --from-literal=token="$CLOUDFLARE_TUNNEL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "::notice::Secret cloudflared-tunnel-token synced successfully."

      - name: Verify secrets
        run: |
          echo "==> Current secrets in media namespace:"
          kubectl get secrets -n media
