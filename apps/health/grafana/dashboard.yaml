              "query": "from(bucket: \"health\")\n  |> range(start: -60d)\n  |> filter(fn: (r) => r[\"_field\"] == \"value\")\n  |> filter(fn: (r) => r[\"entity_id\"] =~ /(weight|body_fat|lean_body_mass|bone_mass)$/)\n  |> last()\n  |> group()\n  |> keep(columns: [\"entity_id\", \"_value\"])"
