        {
          "type": "volkovlabs-echarts-panel",
          "title": "Body composition",
          "description": "Whole-body composition drawn as a proportional figure. Health Connect carries no per-limb data, so this is a container, not an anatomical map.",
          "datasource": {
            "type": "influxdb",
            "uid": "influxdb"
          },
          "gridPos": {
            "h": 13,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "targets": [
            {
              "datasource": {
                "type": "influxdb",
                "uid": "influxdb"
              },
              "refId": "A",
              "query": "from(bucket: \"health\")\n  |> range(start: -60d)\n  |> filter(fn: (r) => r[\"_field\"] == \"value\")\n  |> filter(fn: (r) => r[\"entity_id\"] =~ /weight|body_fat|lean|bone_mass/)\n  |> last()\n  |> keep(columns: [\"entity_id\", \"_value\"])"
            }
          ],
          "options": {
            "getOption": "\n// Body composition as a filled silhouette.\n//\n// Health Connect carries WHOLE-BODY composition only -- there is no per-limb\n// data -- so the figure is a proportional container, not an anatomical map.\n// The caption says so, because a body outline invites exactly that misreading.\nconst HUMAN = 'M100,20 a26,26 0 1,0 0.1,0 Z M88,70 L112,70 C126,72 140,80 146,94 L168,150 C172,162 168,172 158,175 C149,178 141,172 138,163 L122,120 L126,190 L124,240 L134,330 C136,352 134,392 130,420 C128,432 116,432 114,420 C110,392 106,352 104,330 L100,262 L96,330 C94,352 90,392 86,420 C84,432 72,432 70,420 C66,392 64,352 66,330 L76,240 L74,190 L78,120 L62,163 C59,172 51,178 42,175 C32,172 28,162 32,150 L54,94 C60,80 74,72 88,70 Z';\n\n// ---- pull the latest value per entity out of whatever frame shape we get\nconst vals = {};\n(data.series || []).forEach((frame) => {\n  const idF = frame.fields.find((f) => f.name === 'entity_id' || f.type === 'string');\n  const vF = frame.fields.find((f) => f.type === 'number');\n  if (!vF) return;\n  const n = vF.values.length;\n  for (let i = 0; i < n; i++) {\n    const id = idF ? String(idF.values.get ? idF.values.get(i) : idF.values[i])\n                   : (frame.name || vF.labels?.entity_id || '');\n    const v = vF.values.get ? vF.values.get(i) : vF.values[i];\n    if (id && v != null) vals[id] = v;\n  }\n});\nconst pick = (rx) => {\n  const k = Object.keys(vals).find((k) => rx.test(k));\n  return k ? vals[k] : null;\n};\nconst weight = pick(/weight/i);\nconst fatPct = pick(/body_fat|fat_percent/i);\nconst bone = pick(/bone_mass/i);\nlet lean = pick(/lean/i);\n\nconst W = echartsInstance.getWidth(), H = echartsInstance.getHeight();\nconst note = (msg) => ({ graphic: { elements: [{\n  type: 'text', left: 'center', top: 'middle',\n  style: { text: msg, fontSize: 14, fill: theme.colors.text.secondary } }] } });\n\nif (!weight || !fatPct) {\n  return note('Waiting for weight and body fat.\\nEnable the Health Connect sensors in the companion app.');\n}\nconst fat = weight * fatPct / 100;\nif (lean == null) lean = weight - fat - (bone || 0);\n\n// Bone is a ~4% sliver: ordering puts it mid-torso where the figure is widest,\n// so it is actually visible. The order is legend-driven, not anatomical.\nconst parts = [\n  { name: 'Lean', kg: lean, color: '#3FA37A' },\n  { name: 'Bone', kg: bone || 0, color: '#8C6BD8' },\n  { name: 'Fat',  kg: fat,  color: '#D2762A' },\n].filter((p) => p.kg > 0);\nconst total = parts.reduce((s, p) => s + p.kg, 0);\n\n// The silhouette is authored in a 220 x 469 box; scale it to the panel and\n// keep room on the right for labels.\nconst VBW = 220, VBH = 469, LABEL_W = 210;\nconst scale = Math.min((W - LABEL_W) / VBW, (H - 30) / VBH);\nconst bw = VBW * scale, bh = VBH * scale;\nconst ox = 8, oy = (H - bh) / 2 - 6;\n\nconst bodyShape = { pathData: HUMAN, x: 0, y: 0, width: VBW, height: VBH };\nconst bands = [];\nlet y = oy + bh;\nparts.forEach((p) => {\n  const h = bh * p.kg / total;\n  y -= h;\n  bands.push({ ...p, y, h, pct: (p.kg / total) * 100 });\n});\n\nconst els = [\n  { type: 'path', shape: bodyShape, x: ox, y: oy,\n    scaleX: scale, scaleY: scale, originX: 0, originY: 0,\n    style: { fill: theme.isDark ? '#2a2d31' : '#eae7e2' } },\n  { type: 'group',\n    clipPath: { type: 'path', shape: bodyShape, x: ox, y: oy,\n                scaleX: scale, scaleY: scale, originX: 0, originY: 0 },\n    children: bands.map((b) => ({\n      type: 'rect',\n      // 2px gap between fills: the palette clears CVD separation only in the\n      // 6-8 band, which is legal with secondary encoding -- gaps and labels.\n      shape: { x: ox, y: b.y + 1, width: bw, height: Math.max(b.h - 2, 1) },\n      style: { fill: b.color },\n    })) },\n  { type: 'path', shape: bodyShape, x: ox, y: oy,\n    scaleX: scale, scaleY: scale, originX: 0, originY: 0,\n    style: { fill: 'none', stroke: theme.isDark ? '#9aa0a6' : '#4a463f', lineWidth: 2 } },\n];\n\n// Labels top-to-bottom with a minimum spacing, so a thin band never collides.\nlet ty = oy + 14;\n[...bands].sort((a, b) => a.y - b.y).forEach((b) => {\n  const cy = b.y + b.h / 2;\n  ty = Math.max(cy, ty);\n  const lx = ox + bw + 4;\n  els.push(\n    { type: 'line', shape: { x1: lx, y1: cy, x2: lx + 30, y2: ty },\n      style: { stroke: theme.colors.border.medium, lineWidth: 1.5 } },\n    { type: 'rect', shape: { x: lx + 34, y: ty - 13, width: 11, height: 11, r: 2 },\n      style: { fill: b.color } },\n    { type: 'text', x: lx + 51, y: ty - 13,\n      style: { text: b.name, fontSize: 15, fontWeight: 600, fill: theme.colors.text.primary } },\n    { type: 'text', x: lx + 34, y: ty + 4,\n      style: { text: b.kg.toFixed(1) + ' kg \u00b7 ' + b.pct.toFixed(1) + '%',\n               fontSize: 14, fill: theme.colors.text.secondary } },\n  );\n  ty += 58;\n});\nels.push({ type: 'text', x: 8, y: H - 16,\n  style: { text: 'Share of total body mass \u2014 not where it sits',\n           fontSize: 12, fill: theme.colors.text.secondary } });\n\nreturn { animation: false, graphic: { elements: els } };\n",
            "renderer": "canvas",
            "themeEditor": {
              "config": "{}",
              "name": "default"
            }
