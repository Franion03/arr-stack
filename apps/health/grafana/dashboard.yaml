          "options": {
            "getOption": "\n// Business Charts v7 injects exactly one variable: `context`.\n//   context.panel.data / context.panel.chart / context.grafana.theme\n// The older `data` / `theme` / `echartsInstance` globals do not exist.\nconst series = context.panel.data.series || [];\nconst chart = context.panel.chart;\nconst theme = context.grafana.theme;\nconst W = chart.getWidth(), H = chart.getHeight();\n\nconst txt = (msg) => ({ graphic: { elements: [{\n  type: 'text', left: 'center', top: 'middle',\n  style: { text: msg, fontSize: 14, lineHeight: 20, align: 'center',\n           fill: theme.colors.text.secondary } }] } });\n\n// The silhouette is a POLYGON, not an SVG path. ECharts' graphic component\n// registers image/text/circle/sector/ring/polygon/polyline/line/bezierCurve/\n// rect/group -- there is no 'path' type, and asking for one fails with\n// \"is not a constructor\" inside _updateElements. The curves were sampled to\n// these points offline.\nconst BODY = [[88.0, 70.0], [112.0, 70.0], [115.0, 70.5], [118.0, 71.2], [120.9, 72.1], [123.8, 73.2], [126.6, 74.4], [129.4, 75.9], [132.0, 77.5], [134.5, 79.3], [136.9, 81.3], [139.1, 83.5], [141.1, 85.8], [143.0, 88.4], [144.6, 91.1], [146.0, 94.0], [168.0, 150.0], [168.7, 152.5], [169.2, 155.0], [169.5, 157.4], [169.5, 159.7], [169.3, 161.9], [168.9, 163.9], [168.2, 165.9], [167.4, 167.7], [166.3, 169.3], [165.1, 170.8], [163.6, 172.2], [161.9, 173.3], [160.1, 174.2], [158.0, 175.0], [156.1, 175.5], [154.2, 175.8], [152.4, 175.8], [150.6, 175.5], [148.9, 175.0], [147.3, 174.4], [145.8, 173.5], [144.3, 172.4], [142.9, 171.2], [141.7, 169.8], [140.6, 168.3], [139.6, 166.7], [138.7, 164.9], [138.0, 163.0], [122.0, 120.0], [126.0, 190.0], [124.0, 240.0], [134.0, 330.0], [134.4, 335.0], [134.6, 340.4], [134.8, 346.3], [134.8, 352.6], [134.7, 359.1], [134.5, 365.8], [134.2, 372.8], [133.9, 379.8], [133.4, 386.8], [132.9, 393.8], [132.3, 400.6], [131.6, 407.4], [130.8, 413.8], [130.0, 420.0], [129.4, 422.4], [128.