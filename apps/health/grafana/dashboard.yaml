t idF = frame.fields.find((f) => f.name === 'entity_id') ||\n                frame.fields.find((f) => f.type === 'string');\n    const vF = frame.fields.find((f) => f.type === 'number');\n    if (!vF) return;\n    const get = (f, i) => (f.values.get ? f.values.get(i) : f.values[i]);\n    for (let i = 0; i < vF.values.length; i++) {\n      const id = idF ? String(get(idF, i))\n                     : String((vF.labels && vF.labels.entity_id) || frame.name || '');\n      const v = get(vF, i);\n      if (id && v != null) vals[id] = v;\n    }\n  });\n  const pick = (rx) => {\n    const k = Object.keys(vals).find((k) => rx.test(k));\n    return k != null ? vals[k] : null;\n  };\n  const weight = pick(/weight/i);\n  const fatPct = pick(/body_fat|fat_percent/i);\n  const bone = pick(/bone_mass/i);\n  let lean = pick(/lean/i);\n\n  if (weight == null || fatPct == null) {\n    return txt('Waiting for weight and body fat.\\nEnable the Health Connect sensors\\nin the companion app.');\n  }\n  const fat = weight * fatPct / 100;\n  if (lean == null) lean = weight - fat - (bone || 0);\n\n  // Bone is a ~4% sliver: this order puts it mid-torso where the figure is\n  // widest, so it is visible at all. Legend-driven, not anatomical.\n  const parts = [\n    { name: 'Lean', kg: lean, color: '#3FA37A' },\n    { name: 'Bone', kg: bone || 0, color: '#8C6BD8' },\n    { name: 'Fat', kg: fat, color: '#D2762A' },\n  ].filter((p) => p.kg > 0);\n  const total = parts.reduce((s, p) => s + p.kg, 0);\n  if (!(total > 0)) return txt('No usable composition values yet.');\n\n  const LABEL_W = 200;\n  const vw = VB.x1 - VB.x0, vh = VB.y1 - VB.y0;\n  const scale = Math.max(Math.min((W - LABEL_W) / vw, (H - 34) / vh), 0.05);\n  const fw = vw * scale, fh = vh * scale;\n  const ox = 12, oy = Math.max((H - fh) / 2 - 8, 4);\n  const sx = (x) => ox + (x - VB.x0) * scale;\n  const sy = (y) => oy + (y - VB.y0) * scale;\n\n  const bodyPts = BODY.map((p) => [sx(p[0]), sy(p[1])]);\n  const head = { cx: sx(HEAD.cx), cy: sy(HEAD.cy), r: HEAD.r * scale };\n\n  const bands = [];\n  let y = oy + fh;\n  parts.forEach((p) => {\n    const h = fh * p.kg / total;\n    y -= h;\n    bands.push({ ...p, y, h, pct: (p.kg / total) * 100 });\n  });\n  // 2px gaps: the palette clears CVD separation only in the 6-8 band, which is\n  // legal solely with secondary encoding -- these gaps and the direct labels.\n  const fills = bands.map((b) => ({\n    type: 'rect',\n    shape: { x: ox - 4, y: b.y + 1, width: fw + 8, height: Math.max(b.h - 2, 1) },\n    style: { fill: b.color },\n  }));\n\n  const base = theme.isDark ? '#2a2d31' : '#eae7e2';\n  const line = theme.isDark ? '#9aa0a6' : '#4a463f';\n  const els = [\n    { type: 'polygon', shape: { points: bodyPts }, style: { fill: base } },\n    { type: 'circle', shape: head, style: { fill: base } },\n    // One clip group per shape: a clipPath is a single element, and the figure\n    // is a body plus a detached head.\n    { type: 'group', clipPath: { type: 'polygon', shape: { points: bodyPts } },\n      children: fills },\n    { type: 'group', clipPath: { type: 'circle', shape: head },\n      children: fills.map((f) => ({ ...f })) },\n    { type: 'polygon', shape: { points: bodyPts },\n      style: { fill: 'none', stroke: line, lineWidth: 2 } },\n    { type: 'circle', shape: head,\n      style: { fill: 'none', stroke: line, lineWidth: 2 } },\n  ];\n\n  let ty = oy + 14;\n  [...bands].sort((a, b) => a.y - b.y).forEach((b) => {\n    const cy = b.y + b.h / 2;\n    ty = Math.max(cy, ty);\n    const lx = ox + fw + 8;\n    els.push(\n      { type: 'line', shape: { x1: lx, y1: cy, x2: lx + 26, y2: ty },\n        style: { stroke: theme.colors.border.medium, lineWidth: 1.5 } },\n      { type: 'rect', shape: { x: lx + 30, y: ty - 13, width: 11, height: 11, r: 2 },\n        style: { fill: b.color } },\n      { type: 'text', x: lx + 47, y: ty - 13,\n        style: { text: b.name, fontSize: 15, fontWeight: 600,\n                 fill: theme.colors.text.primary } },\n      { type: 'text', x: lx + 30, y: ty + 4,\n        style: { text: b.kg.toFixed(1) + ' kg \u00b7 ' + b.pct.toFixed(1) + '%',\n                 fontSize: 14, fill: theme.colors.text.secondary } },\n    );\n    ty += 56;\n  });\n\n  els.push({ type: 'text', x: 12, y: H - 16,\n    style: { text: 'Share of total body mass \u2014 not where it sits',\n             fontSize: 12, fill: theme.colors.text.secondary } });\n\n  return { animation: false, graphic: { elements: els } };\n} catch (e) {\n  return txt('Composition panel error:\\n' + (e && e.message ? e.message : String(e)));\n}\n",
