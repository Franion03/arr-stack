# Provisioned from git, not authored in Grafana: a Grafana database loss
# must not cost every panel. allowUiUpdates is false, so edits made in the
# browser are discarded -- change this file instead.
#
# Panels match entity_id by REGEX rather than exact name. Home Assistant is
# connected and writing, but the Health Connect sensors are not enabled in the
# companion app yet, so the real ids are still unknown. Tighten these once they
# appear -- the regexes are a bridge, not the destination.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: health
data:
  health.json: |
    {
      "uid": "casa-health",
      "title": "Health",
      "tags": [
        "casa",
        "health"
      ],
      "timezone": "Europe/Madrid",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "refresh": "5m",
      "time": {
        "from": "now-90d",
        "to": "now"
      },
      "panels": [
        {
          "type": "stat",
          "title": "Weight",
          "datasource": {
            "type": "influxdb",
            "uid": "influxdb"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "influxdb",
                "uid": "influxdb"
              },
              "query": "from(bucket: \"health\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r[\"_field\"] == \"value\")\n  |> filter(fn: (r) => r[\"entity_id\"] =~ /weight|peso|body_mass/)\n  |> aggregateWindow(every: 1h, fn: mean, createEmpty: false)\n  |> keep(columns: [\"_time\", \"_value\", \"entity_id\"])",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "last"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "none",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "kg",
              "decimals": 1,
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
