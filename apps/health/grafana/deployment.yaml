apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: health
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472          # the uid grafana runs as
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: health-secrets, key: GRAFANA_ADMIN_PASSWORD }
            # Read by the provisioned datasource as $INFLUXDB_ADMIN_TOKEN.
            - name: INFLUXDB_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: health-secrets, key: INFLUXDB_ADMIN_TOKEN }
            - name: GF_SERVER_ROOT_URL
              value: "http://grafana.192.168.1.114.nip.io"
            # Nobody else should be creating accounts on the health data.
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            # Business Charts (Apache ECharts). Grafana has no body-diagram
            # panel and Canvas cannot fill an arbitrary shape proportionally,
            # so the composition figure needs a panel that draws real SVG.
            # Downloaded at container start, which makes startup depend on
            # reaching grafana.com -- if that fails Grafana still boots and
            # only that one panel is missing.
            - name: GF_INSTALL_PLUGINS
              value: "volkovlabs-echarts-panel"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: provisioning-datasources
          configMap:
            name: grafana-provisioning
            items:
              - key: datasource.yaml
                path: datasource.yaml
        - name: provisioning-dashboards
          configMap:
            name: grafana-provisioning
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboards
          configMap:
            name: grafana-dashboards
