# LAN-only, and intentionally so. This is medical-adjacent data on a machine
# that also runs a Cloudflare tunnel; nip.io resolves to 192.168.1.114, a
# private address, so this hostname is unreachable from outside and shares
# neither an ingress hostname nor a certificate with anything published.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: health
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.192.168.1.114.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
