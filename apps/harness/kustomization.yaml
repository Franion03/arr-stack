# Harness — the LLM-agnostic assistant. Application code lives in a separate
# repo (github.com/Franion03/home-harness); this directory is only how it is
# deployed on this cluster.
#
# arr-stack-root's destination namespace is `media`, so every resource here
# pins `assistant` explicitly and the namespace transformer below enforces it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: assistant

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: harness-config
    files:
      - models.yaml

# The generated name carries a content hash, so editing models.yaml rolls the
# deployment automatically — a model swap needs no other change.
generatorOptions:
  disableNameSuffixHash: false
