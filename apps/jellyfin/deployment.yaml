apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        supplementalGroups:
          - 44    # video group - access to /dev/dri/card0
          - 992   # render group - access to /dev/dri/renderD128
      initContainers:
        - name: enable-hw-accel
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              if [ -f /config/encoding.xml ]; then
                sed -i 's|<HardwareAccelerationType>none</HardwareAccelerationType>|<HardwareAccelerationType>vaapi</HardwareAccelerationType>|' /config/encoding.xml
                sed -i 's|<VaapiDevice></VaapiDevice>|<VaapiDevice>/dev/dri/renderD128</VaapiDevice>|' /config/encoding.xml
                sed -i 's|<EnableHardwareEncoding>false</EnableHardwareEncoding>|<EnableHardwareEncoding>true</EnableHardwareEncoding>|' /config/encoding.xml
                echo "Hardware acceleration enabled in encoding.xml"
              else
                echo "encoding.xml not found, Jellyfin will create defaults"
              fi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: jellyfin
          image: lscr.io/linuxserver/jellyfin:latest
          securityContext:
            privileged: true
          ports:
            - containerPort: 8096
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Etc/UTC"
            - name: JELLYFIN_PublishedServerUrl
              value: "jellyfin.192.168.1.114.nip.io"
            - name: LIBVA_DRIVERS_PATH
              value: "/usr/lib/jellyfin-ffmpeg/lib/dri"
            - name: LIBVA_DRIVER_NAME
              value: "iHD"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
            - name: dri
              mountPath: /dev/dri
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
