# app.sh runs alembic, seeds and migrations before uvicorn, so the first start
# takes minutes: the startup probe allows up to 10 minutes before liveness.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    type: Recreate          # app.sh migrates the schema; never two at once
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: themomentum/open-wearables-backend:0.11.0@sha256:aaa0ccc7e6dcfbb3a36db6e0f63ec2782cf31a5bbd7cb466d11cd8d4657bc6dd
          command: [scripts/start/app.sh]
          envFrom:
            - configMapRef: { name: open-wearables-config }
            - secretRef: { name: open-wearables-secrets }
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 15
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# LAN-only on purpose, like grafana. The public path (Cloudflare tunnel plus
# Access mTLS) is a separate, later decision.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-wearables-api
spec:
  ingressClassName: nginx
  rules:
    - host: ow-api.192.168.1.114.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
