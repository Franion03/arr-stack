apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: themomentum/open-wearables-frontend:0.11.0@sha256:f78f925612034b2a9f196ebda562c21258e84573f8eb1f1e024d43bd49b887ba
          env:
            # What a browser dials.
            - name: VITE_API_URL
              value: http://ow-api.192.168.1.114.nip.io
            # The server's own hop stays inside the cluster.
            - name: API_URL
              value: http://backend:8000
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 15
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-wearables-portal
spec:
  ingressClassName: nginx
  rules:
    - host: ow.192.168.1.114.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
