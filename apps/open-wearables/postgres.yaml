apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ow-postgres-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate          # single RWO volume
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: open-wearables
            - name: POSTGRES_USER
              value: open-wearables
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: open-wearables-secrets, key: POSTGRES_PASSWORD }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          volumeMounts:
            # PG 18 images keep the versioned data dir under /var/lib/postgresql.
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U open-wearables -d open-wearables"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, "pg_isready -U open-wearables -d open-wearables"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ow-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
