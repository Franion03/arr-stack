# Reference only — never commit real values.
#
# One Secret feeds both pods, but each is given only the keys it needs, by
# name. Open WebUI gets the model keys and its session signing key; the tool
# server gets the Home Assistant token and the Google credentials. Neither
# receives the other's.
#
# Produced by:
#   scripts/create-harness-secret.sh          (local bootstrap)
#   .github/workflows/seal-secrets.yml        (GitOps, from GitHub Secrets)
#
# The canonical list of keys lives in secrets/keys.env.example.
apiVersion: v1
kind: Secret
metadata:
  name: harness-secrets
  namespace: assistant
type: Opaque
stringData:
  CF_ACCOUNT_ID: ""
  CF_AI_GATEWAY: "home-harness"
  CF_AI_GATEWAY_TOKEN: ""

  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GOOGLE_AI_API_KEY: ""
  OPENROUTER_API_KEY: ""
  GROQ_API_KEY: ""
  CF_WORKERS_AI_TOKEN: ""
  ELEVENLABS_API_KEY: ""
  DEEPGRAM_API_KEY: ""

  HA_URL: "http://192.168.1.117:8123"
  HA_TOKEN: ""

  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GOOGLE_REFRESH_TOKEN: ""
  GOOGLE_CALENDAR_ID: "primary"

  # Per-connection custom headers for Open WebUI's OpenAI client. Carries the
  # AI Gateway token, which is why it is here and not in the ConfigMap.
  # Composed by the seal workflow from CF_AI_GATEWAY_TOKEN.
  OPENAI_API_CONFIGS: '{"0":{"headers":{"cf-aig-authorization":"Bearer <CF_AI_GATEWAY_TOKEN>"}}}'

  # The tool server registration, composed by the seal workflow from
  # TOOLS_API_KEY. Declared here rather than typed into the admin UI, which
  # ENABLE_PERSISTENT_CONFIG=false makes the app ignore.
  TOOL_SERVER_CONNECTIONS: '[{"url":"http://harness.assistant.svc.cluster.local","auth_type":"bearer","key":"<TOOLS_API_KEY>"}]'

  # Bearer token Open WebUI presents to the tool server
  TOOLS_API_KEY: ""
  # signs Open WebUI's sessions; must stay stable across restarts
  WEBUI_SECRET_KEY: ""
