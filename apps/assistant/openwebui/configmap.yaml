apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-config
  namespace: assistant
data:
  # ─────────────────────────────────────────────────────────────────────
  # THE MODEL SWAP POINT.
  #
  # Both URLs go through the Cloudflare AI Gateway, which gives caching,
  # cost analytics and rate limiting without touching the application.
  # Account a64d6975... , gateway "home-harness".
  #
  # To change vendor, change the provider segment and point OPENAI_API_KEY
  # at the matching secret key in the Deployment:
  #
  #   anthropic         .../anthropic/v1        (ANTHROPIC_API_KEY)
  #   openai            .../openai/v1           (OPENAI_API_KEY)
  #   google-ai-studio  .../google-ai-studio/v1beta/openai (GOOGLE_AI_API_KEY)
  #   openrouter        .../openrouter/v1       (OPENROUTER_API_KEY)
  #
  # Set it to the vendor's own URL to bypass the gateway entirely, e.g.
  # https://api.anthropic.com/v1
  # ─────────────────────────────────────────────────────────────────────
  # Two connections, ';'-separated. The ORDER is load-bearing: it must
  # match OPENAI_API_KEYS and the "0"/"1" keys of OPENAI_API_CONFIGS,
  # both composed by the seal workflow.
  #
  #   0  google-ai-studio  Gemini, the default. Provider path, so the
  #                        model list is 54 Gemini entries.
  #   1  compat            OpenRouter and friends. Multi-provider, so
  #                        its list is whitelisted in OPENAI_API_CONFIGS
  #                        -- unfiltered it advertises ~2600 models.
  OPENAI_API_BASE_URLS: "https://gateway.ai.cloudflare.com/v1/a64d697589a565c03774f1962f7cbf96/home-harness/google-ai-studio/v1beta/openai;https://gateway.ai.cloudflare.com/v1/a64d697589a565c03774f1962f7cbf96/home-harness/compat"

  # Speech always goes to OpenAI, whichever vendor answers the chat.
  OPENAI_AUDIO_BASE_URL: "https://gateway.ai.cloudflare.com/v1/a64d697589a565c03774f1962f7cbf96/home-harness/openai/v1"
