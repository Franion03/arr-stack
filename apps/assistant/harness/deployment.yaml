apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness
  namespace: assistant
  labels:
    app: harness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harness
  template:
    metadata:
      labels:
        app: harness
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: harness
          # Pinned by digest: a mutable tag gives no rollback target and no
          # drift detection -- ArgoCD reports Synced while the running image
          # differs. Renovate moves this pin; the build workflow in
          # Franion03/home-harness prints the new digest to its job summary.
          image: ghcr.io/franion03/home-harness:latest@sha256:a3d1b3104c4d8918dd8b262b0440365484c92d4e0a4ae32f4ea61ee986ae64ca
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Only the credentials this server actually uses. No model-vendor
            # key is mounted here — it never talks to an LLM.
            # Body metrics, read-only. InfluxDB lives in the `health` namespace;
            # nothing writes from here -- Home Assistant does that. The token is
            # the same InfluxDB admin token the health stack was created with,
            # carried into this namespace by the seal workflow.
            - name: INFLUXDB_URL
              value: "http://influxdb.health.svc.cluster.local:8086"
            - name: INFLUXDB_ORG
              value: "casa"
            - name: INFLUXDB_BUCKET
              value: "health"
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef: { name: harness-secrets, key: INFLUXDB_ADMIN_TOKEN }

            - name: HA_URL
              valueFrom:
                secretKeyRef: { name: harness-secrets, key: HA_URL }
            - name: HA_TOKEN
              valueFrom:
                secretKeyRef: { name: harness-secrets, key: HA_TOKEN }
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: harness-secrets, key: GOOGLE_CLIENT_ID }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: harness-secrets, key: GOOGLE_CLIENT_SECRET }
            - name: GOOGLE_REFRESH_TOKEN
              valueFrom:
                secretKeyRef: { name: harness-secrets, key: GOOGLE_REFRESH_TOKEN }
            - name: GOOGLE_CALENDAR_ID
              valueFrom:
                secretKeyRef: { name: harness-secrets, key: GOOGLE_CALENDAR_ID }
            - name: TOOLS_API_KEY
              valueFrom:
                secretKeyRef: { name: harness-secrets, key: TOOLS_API_KEY }
            - name: TZ
              value: "Europe/Madrid"
            - name: LOG_LEVEL
              value: "INFO"
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: { cpu: 50m,  memory: 96Mi }
            limits:   { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
