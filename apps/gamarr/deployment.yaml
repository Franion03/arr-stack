apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamarr
  namespace: media
  labels:
    app: gamarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gamarr
  template:
    metadata:
      labels:
        app: gamarr
    spec:
      containers:
        - name: gamarr
          image: ghcr.io/gamarr-app/gamarr:latest
          ports:
            - containerPort: 6767
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Etc/UTC"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: gamarr-config
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
